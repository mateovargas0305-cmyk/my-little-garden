# Headers de cache para que Netlify NO sirva versiones viejas
# Cuando subís un nuevo deploy, los archivos críticos se actualizan al instante

[[headers]]
  for = "/sw.js"
  [headers.values]
    # No cachear el Service Worker - SIEMPRE buscar en el servidor
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    # No cachear el HTML principal
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS y CSS: no cachear para que el SW pueda manejar las versiones
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Iconos sí pueden cachearse mucho tiempo (no cambian seguido)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
